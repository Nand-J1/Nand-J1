<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">NJ — Exploring the space between code and possibility</title>
  <desc id="desc">A dark cosmic banner with teal and emerald nebula curves, a star field, and a glowing NJ monogram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030913"/>
      <stop offset=".52" stop-color="#071A28"/>
      <stop offset="1" stop-color="#04110F"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20BFA7" stop-opacity="0"/>
      <stop offset=".46" stop-color="#31E6C4" stop-opacity=".28"/>
      <stop offset=".72" stop-color="#3CBB8C" stop-opacity=".15"/>
      <stop offset="1" stop-color="#20BFA7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55E6D0" stop-opacity="0"/>
      <stop offset=".5" stop-color="#55E6D0" stop-opacity=".9"/>
      <stop offset="1" stop-color="#55E6D0" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#31E6C4" stop-opacity=".2"/>
      <stop offset="1" stop-color="#31E6C4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <ellipse cx="840" cy="80" rx="410" ry="170" fill="url(#glow)" filter="url(#soft)"/>
  <path d="M430 0 C610 70 610 165 780 115 S1030 20 1200 78 L1200 0Z" fill="url(#aurora)">
    <animate attributeName="opacity" values=".62;.95;.62" dur="11s" repeatCount="indefinite"/>
  </path>
  <path d="M580 0 C700 100 770 180 900 95 S1090 55 1200 130" fill="none" stroke="#42D9B8" stroke-opacity=".26" stroke-width="2"/>
  <path d="M460 0 C610 90 670 215 840 140 S1080 100 1200 170" fill="none" stroke="#7CF0D6" stroke-opacity=".18" stroke-width="1.5"/>
  <g fill="#D7FFF6">
    <circle cx="90" cy="48" r="1.4"/><circle cx="180" cy="91" r="1"/><circle cx="272" cy="34" r="1.2"/>
    <circle cx="355" cy="83" r=".9"/><circle cx="467" cy="42" r="1.3"/><circle cx="550" cy="70" r=".8"/>
    <circle cx="690" cy="36" r="1.2"/><circle cx="770" cy="65" r=".8"/><circle cx="910" cy="37" r="1.4"/>
    <circle cx="1010" cy="62" r="1"/><circle cx="1114" cy="31" r="1.2"/><circle cx="1152" cy="94" r=".8"/>
    <circle cx="128" cy="246" r="1"/><circle cx="264" cy="287" r="1.2"/><circle cx="390" cy="240" r=".8"/>
    <circle cx="520" cy="280" r="1.1"/><circle cx="705" cy="255" r="1"/><circle cx="840" cy="286" r="1.2"/>
    <circle cx="1000" cy="247" r=".9"/><circle cx="1120" cy="282" r="1.3"/>
  </g>
  <g transform="translate(600 104)" text-anchor="middle">
    <text x="0" y="0" fill="#55E6D0" font-family="monospace" font-size="13" letter-spacing="7">N A N D A N A  /  N J</text>
    <text x="0" y="80" fill="#F0FBFA" font-family="Georgia, 'Times New Roman', serif" font-size="62" letter-spacing="1">Beyond the Code</text>
    <text x="0" y="119" fill="#A6C6C8" font-family="monospace" font-size="15" letter-spacing="2">EXPLORE  ·  BUILD  ·  UNDERSTAND</text>
  </g>
  <path d="M360 255 H840" stroke="url(#edge)" stroke-width="1"/>
  <circle cx="600" cy="255" r="3" fill="#55E6D0">
    <animate attributeName="opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/>
  </circle>
  <rect x=".5" y=".5" width="1199" height="329" rx="18" fill="none" stroke="#5EEAD4" stroke-opacity=".22"/>
</svg>